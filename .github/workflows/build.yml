name: Tests

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    name: Build kanvas.jar
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Compile
        run: ./compile.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kanvas-jar
          path: build/kanvas.jar
          retention-days: 1

  test-sketches:
    name: Test — ${{ matrix.sketch }}
    runs-on: ubuntu-latest
    needs: build

    strategy:
      fail-fast: false
      matrix:
        sketch: [test-shapes, test-drawmodes, test-input, test-nested]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Download kanvas.jar
        uses: actions/download-artifact@v4
        with:
          name: kanvas-jar
          path: build/

      - name: Build ${{ matrix.sketch }}
        working-directory: tests/projects/${{ matrix.sketch }}
        run: java -jar ../../../build/kanvas.jar build

  unit-tests:
    name: Unit tests — ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Run tests (Linux)
        if: runner.os != 'Windows'
        run: bash test.sh

      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\test.ps1
